<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Adwa Supplements</title>
  <meta name="description" content="Admin dashboard for managing products, orders, and inventory.">
  <meta name="theme-color" content="#0B2218">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/page.css">
</head>
<body>

  <div id="header-placeholder"></div>

  <main>
    <section class="page-content active" id="view-admin">
      <div class="admin-shell">
        <aside class="admin-sidebar">
          <div class="brand-logo" style="margin-bottom:30px;">
            <div class="brand-emblem" style="width:40px;height:40px;">
              <img src="images/adwa.jpg" alt="Logo">
            </div>
            <span class="brand-title" style="color:#fff;font-size:1.2rem;">ADWA</span>
          </div>

          <nav style="display:flex;flex-direction:column;gap:8px;">
            <button style="display:flex;align-items:center;gap:10px;color:#fff;padding:12px 14px;border-radius:8px;background:rgba(79,70,229,0.2);font-weight:700;">
              <i class="fa-solid fa-gauge" style="color:var(--accent-bright);"></i> Dashboard
            </button>
            <button onclick="window.location.href='shop.html'" style="display:flex;align-items:center;gap:10px;color:rgba(250,247,240,0.75);padding:12px 14px;border-radius:8px;">
              <i class="fa-solid fa-store"></i> View Storefront
            </button>
            <button onclick="handleAdminLogout()" style="display:flex;align-items:center;gap:10px;color:var(--red);padding:12px 14px;border-radius:8px;margin-top:40px;">
              <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
          </nav>
        </aside>

        <div class="admin-main">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:14px;">
            <h2>Management Overview</h2>
            <button class="btn btn-outline btn-sm" onclick="exportProductsCSV()">
              <i class="fa-solid fa-file-csv"></i> Export Products CSV
            </button>
          </div>

          <!-- Stats Grid -->
          <div class="stat-grid" id="adminStatsGrid"></div>

          <!-- Orders Table -->
          <div style="margin-bottom:40px;">
            <h3 style="margin-bottom:16px;">Recent Orders</h3>
            <div style="overflow-x:auto;">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Phone</th>
                    <th>Total</th>
                    <th>Payment</th>
                    <th>Status</th>
                    <th>Date</th>
                  </tr>
                </thead>
                <tbody id="adminOrdersTbody"></tbody>
              </table>
            </div>
          </div>

          <!-- Products Table -->
          <div>
            <h3 style="margin-bottom:16px;">Product Inventory</h3>
            <div style="overflow-x:auto;">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="adminProductsTbody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <div id="mobile-nav-placeholder"></div>
  <script src="js/components.js"></script>
  <script src="js/global.js"></script>
</body>
</html>
