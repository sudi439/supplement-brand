<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Adwa Supplements</title>
  <meta name="description" content="Get in touch with Adwa Supplements via WhatsApp, Telegram, phone, or email.">
  <meta name="theme-color" content="#0B2218">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/page.css">
</head>
<body>

  <div id="header-placeholder"></div>

  <main>
    <section class="page-content active" id="view-contact">
      <div style="background:var(--blue-deep);color:#fff;padding:60px 0;text-align:center;">
        <span class="eyebrow" style="color:var(--accent-light);">Get in Touch</span>
        <h1 style="color:#fff;font-size:2.5rem;">We're Here to Assist You</h1>
      </div>
      <div class="section">
        <div class="wrap">
          <div style="display:grid;grid-template-columns:1fr;gap:36px;">
            <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:32px;">
              <!-- Contact Card -->
              <div style="background:var(--blue-deep);color:#fff;border-radius:var(--radius-lg);padding:36px;border:1.5px solid var(--line-accent);">
                <h3 style="color:#fff;margin-bottom:20px;">Adwa Headquarters</h3>
                <div style="display:flex;gap:14px;margin-bottom:18px;">
                  <i class="fa-solid fa-location-dot" style="color:var(--accent-bright);font-size:1.2rem;"></i>
                  <div>
                    <strong style="display:block;color:#fff;">Bole Road, Addis Ababa</strong>
                    <span style="color:rgba(250,247,240,0.75);font-size:0.9rem;">Behind Edna Mall, 3rd Floor</span>
                  </div>
                </div>
                <div style="display:flex;gap:14px;margin-bottom:18px;">
                  <i class="fa-solid fa-phone" style="color:var(--accent-bright);font-size:1.2rem;"></i>
                  <div>
                    <strong style="display:block;color:#fff;">Direct Phone / WhatsApp</strong>
                    <span style="color:rgba(250,247,240,0.75);font-size:0.9rem;">+251 91 234 5678</span>
                  </div>
                </div>
                <div style="display:flex;gap:14px;margin-bottom:26px;">
                  <i class="fa-solid fa-envelope" style="color:var(--accent-bright);font-size:1.2rem;"></i>
                  <div>
                    <strong style="display:block;color:#fff;">Customer Support</strong>
                    <span style="color:rgba(250,247,240,0.75);font-size:0.9rem;">hello@adwasupplements.com</span>
                  </div>
                </div>

                <div style="display:flex;gap:12px;flex-wrap:wrap;">
                  <a href="https://wa.me/251912345678" target="_blank" class="btn btn-outline-light btn-sm" style="background:#25D366;border-color:#25D366;color:#fff;">
                    <i class="fa-brands fa-whatsapp"></i> WhatsApp
                  </a>
                  <a href="https://t.me/adwasupplements" target="_blank" class="btn btn-outline-light btn-sm" style="background:#229ED9;border-color:#229ED9;color:#fff;">
                    <i class="fa-brands fa-telegram"></i> Telegram
                  </a>
                </div>
              </div>

              <!-- Contact Message Form -->
              <form onsubmit="event.preventDefault(); showToast('Message sent! Our team will contact you.', 'fa-paper-plane'); this.reset();" style="background:var(--bg-card);border:1px solid var(--line-accent);border-radius:var(--radius-lg);padding:36px;">
                <h3 style="margin-bottom:18px;">Send a Direct Message</h3>
                <div style="margin-bottom:14px;">
                  <label style="font-size:0.8rem;font-weight:700;text-transform:uppercase;color:var(--blue-deep);display:block;margin-bottom:6px;">Your Name</label>
                  <input type="text" required style="width:100%;padding:12px;border:1.5px solid var(--line-accent);border-radius:var(--radius-sm);">
                </div>
                <div style="margin-bottom:14px;">
                  <label style="font-size:0.8rem;font-weight:700;text-transform:uppercase;color:var(--blue-deep);display:block;margin-bottom:6px;">Email Address</label>
                  <input type="email" required style="width:100%;padding:12px;border:1.5px solid var(--line-accent);border-radius:var(--radius-sm);">
                </div>
                <div style="margin-bottom:20px;">
                  <label style="font-size:0.8rem;font-weight:700;text-transform:uppercase;color:var(--blue-deep);display:block;margin-bottom:6px;">Inquiry Details</label>
                  <textarea required style="width:100%;padding:12px;border:1.5px solid var(--line-accent);border-radius:var(--radius-sm);min-height:100px;" placeholder="How can we assist you today?"></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Send Message <i class="fa-solid fa-paper-plane"></i></button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <div id="mobile-nav-placeholder"></div>
  <script src="js/components.js"></script>
  <script src="js/global.js"></script>
</body>
</html>
